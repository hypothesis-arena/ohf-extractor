.14423/SMJ.0000000000001971\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e. PMID: 42229556\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eGottweis J, Weng W-H, Daryin A et al (2025) Towards an AI co-scientist. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003e10.48550/arXiv.2502.18864\u003c/span\u003e\u003cspan address=\"10.48550/arXiv.2502.18864\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e. (Peer-reviewed version subsequently published in Nature, 2026.) arXiv:2502.18864 [cs.AI]\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eGoogle DeepMind. Co-Scientist: a multi-agent AI partner to accelerate research (2026) Available from: \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003ehttps://deepmind.google/blog/co-scientist-a-multi-agent-ai-partner-to-accelerate-research/\u003c/span\u003e\u003cspan address=\"https://deepmind.google/blog/co-scientist-a-multi-agent-ai-partner-to-accelerate-research/\" targettype=\"URL\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eDeng J, Zeng L, Lai X et al (2018) Metformin protects against intestinal barrier dysfunction via AMPKα1-dependent inhibition of JNK signalling activation. J Cell Mol Med. ;22(1):546\u0026ndash;557. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003e10.1111/jcmm.13342\u003c/span\u003e\u003cspan address=\"10.1111/jcmm.13342\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e. PMID: 29148173\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eCorcoran C, Jacobs TF Metformin. In: StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing; updated 2024. PMID: 30085525\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eLeder J, Diederich A, Patel B, Bowie M et al (2024) Perioperative considerations in alpha-gal syndrome: a review. Cureus. ;16(1):e53208. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003e10.7759/cureus.53208\u003c/span\u003e\u003cspan address=\"10.7759/cureus.53208\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e. PMID: 38425598\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eMcGill SK, Levin ME, Shaheen NJ, Cotton CC et al (2024) Gastrointestinal-isolated distress is common in alpha-gal allergic patients on mammalian meat challenge. J Clin Gastroenterol. ;58(1):80\u0026ndash;84. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003e10.1097/MCG.0000000000001827\u003c/span\u003e\u003cspan address=\"10.1097/MCG.0000000000001827\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e. PMID: 36728603\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003eCommins SP (2020) Diagnosis \u0026amp; management of alpha-gal syndrome: lessons from 2,500 patients. Expert Rev Clin Immunol 16(7):667\u0026ndash;677. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003e10.1080/1744666X.2020.1782745\u003c/span\u003e\u003cspan address=\"10.1080/1744666X.2020.1782745\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/li\u003e\u003c/ol\u003e "}],"fulltextSource":"","fullText":"","funders":[],"hasAdminPriorityOnWorkflow":false,"hasManuscriptDocX":true,"hasOptedInToPreprint":true,"hasPassedJournalQc":"","hasAnyPriority":true,"hideJournal":true,"highlight":"","institution":"Mercy Hospital Springfield","isAcceptedByJournal":false,"isAuthorSuppliedPdf":false,"isDeskRejected":"","isHiddenFromSearch":false,"isInQc":false,"isInWorkflow":false,"isPdf":false,"isPdfUpToDate":true,"isWithdrawnOrRetracted":false,"journal":{"display":true,"email":"contact-bfa7ee347b71@example.org","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true},"keywords":"artificial intelligence, large language models, hypothesis generation, drug repurposing, alpha-gal syndrome, clinical informatics","lastPublishedDoi":"10.21203/rs.3.rs-10439106/v1","lastPublishedDoiUrl":"https://doi.org/10.21203/rs.3.rs-10439106/v1","license":{"name":"CC BY 4.0","url":"https://creativecommons.org/licenses/by/4.0/"},"manuscriptAbstract":"\u003cp\u003eAlpha-gal syndrome (AGS) is a tick induced, IgE-mediated allergy to the mammalian carbohydrate galactose-alpha 1,3-galactose (alpha-gal), with rising incidence and no disease modifying therapy. We describe and critically appraise a physician in the loop workflow in which a practicing clinician used Google's AI co-scientist, a multi-agent system built on the Gemini model, accessed through the experimental Hypothesis Generation tool to generate and rank drug repurposing hypotheses for AGS. Through a structured natural-language interview, the clinician defined the therapeutic goal (durable, drug-free oral tolerance permitting mammalian-meat reintroduction) and five appraisal constraints (oral route; 3\u0026ndash;6 month course; cost \u0026lt;\u003cspan\u003e$\u003c/span\u003e100/month; adults 18\u0026ndash;65, manageable side effects). The system framed the problem into three solution landscapes and returned eleven candidate directions, all built from inexpensive, oral, FDA approved medications, converging on five mechanistic themes centered on the AMPK unfolded protein response (UPR) axis. The top ranked candidate was a metformin guided, phased oral immunotherapy (OIT) protocol, followed by different combinations of metformin, zileuton, ezetimibe, ursodiol, pioglitazone and oral cromolyn. Notably, the system's review agent surfaced specific safety flaws in its own lead proposal. The workflow compressed weeks of cross disciplinary synthesis into a structured, self critiqued hypothesis set, but its outputs are hypotheses, not evidence: mechanistic assumptions are unvalidated and cited literature requires independent verification. Generative AI co-scientists can serve as a rapid, low cost ideation partner that brings a neglected disease within reach of a single clinician investigator, provided every candidate is treated as a starting point for rigorous validation.\u003c/p\u003e","manuscriptTitle":"From Clinical Question to Testable Hypothesis: Using AI Co-Scientist to Identify Repurposable Drugs for Alpha-Gal Syndrome","msid":"","msnumber":"","nonDraftVersions":[{"code":1,"date":"2026-07-23 06:48:03","doi":"10.21203/rs.3.rs-10439106/v1","editorialEvents":[{"type":"communityComments","content":0}],"status":"published","journal":{"display":true,"email":"contact-bfa7ee347b71@example.org","identity":"researchsquare","isNatureJournal":false,"hasQc":true,"allowDirectSubmit":true,"externalIdentity":"","sideBox":"","snPcode":"","submissionUrl":"/submission","title":"Research Square","twitterHandle":"researchsquare","acdcEnabled":true,"dfaEnabled":false,"editorialSystem":"","reportingPortfolio":"","inReviewEnabled":false,"inReviewRevisionsEnabled":true}}],"origin":"","ownerIdentity":"1da94f1b-aa06-493f-987a-feb44830731a","owner":[],"postedDate":"July 23rd, 2026","published":true,"recentEditorialEvents":[],"rejectedJournal":[],"revision":"","amendment":"","status":"posted","subjectAreas":[],"tags":[],"updatedAt":"2026-07-23T06:48:03+00:00","versionOfRecord":[],"versionCreatedAt":"2026-07-23 06:48:03","video":"","vorDoi":"","vorDoiUrl":"","workflowStages":[]},"version":"v1","identity":"rs-10439106","journalConfig":"researchsquare"},"__N_SSP":true},"page":"/article/[identity]/[[...version]]","query":{"identity":"rs-10439106","version":["v1"]},"buildId":"hpPqyMWnMAgSQo80QnYav","isFallback":false,"isExperimentalCompile":false,"dynamicIds":[84888],"gssp":true,"scriptLoader":[]}</script><div hidden="" id="snipcart" data-api-key="ODA3NTlmNDUtYjRjNy00MzE2LTgzNmYtYjUwY2Y4MWFkOWRlNjM3MTQwMjI1MDM0NDU2MjEx"></div></body></html>
