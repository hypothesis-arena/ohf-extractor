ss="tw-px-4"><button type="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-flex tw-items-center"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Status:</h3><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-ml-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-color-gray-800">Posted</p></div></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex"></p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><div class="tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div></div><div class="tw-pt-1"><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Alpha-gal syndrome (AGS) is a tick induced, IgE-mediated allergy to the mammalian carbohydrate galactose-alpha 1,3-galactose (alpha-gal), with rising incidence and no disease modifying therapy. We describe and critically appraise a physician in the loop workflow in which a practicing clinician used Google's AI co-scientist, a multi-agent system built on the Gemini model, accessed through the experimental Hypothesis Generation tool to generate and rank drug repurposing hypotheses for AGS. Through a structured natural-language interview, the clinician defined the therapeutic goal (durable, drug-free oral tolerance permitting mammalian-meat reintroduction) and five appraisal constraints (oral route; 3&ndash;6 month course; cost &lt;<span>$</span>100/month; adults 18&ndash;65, manageable side effects). The system framed the problem into three solution landscapes and returned eleven candidate directions, all built from inexpensive, oral, FDA approved medications, converging on five mechanistic themes centered on the AMPK unfolded protein response (UPR) axis. The top ranked candidate was a metformin guided, phased oral immunotherapy (OIT) protocol, followed by different combinations of metformin, zileuton, ezetimibe, ursodiol, pioglitazone and oral cromolyn. Notably, the system's review agent surfaced specific safety flaws in its own lead proposal. The workflow compressed weeks of cross disciplinary synthesis into a structured, self critiqued hypothesis set, but its outputs are hypotheses, not evidence: mechanistic assumptions are unvalidated and cited literature requires independent verification. Generative AI co-scientists can serve as a rapid, low cost ideation partner that brings a neglected disease within reach of a single clinician investigator, provided every candidate is treated as a starting point for rigorous validation.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">artificial intelligence</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">large language models</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">hypothesis generation</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">drug repurposing</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">alpha-gal syndrome</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">clinical informatics</span></p></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Figures</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-flex tw-flex-wrap tw-items-end tw-pt-2"><button class="tw-mb-4 tw-mr-4 focus:tw-outline-none tw-group" type="button" tabindex="0"><img alt="Figure 1" loading="lazy" width="100" height="100" decoding="async" data-nimg="1" class="tw-mb-2 tw-border-2 tw-border-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F703492f1de29ab87c7ea82ef.png%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F703492f1de29ab87c7ea82ef.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F703492f1de29ab87c7ea82ef.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 1</p></button><button class="tw-mb-4 tw-mr-4 focus:tw-outline-none tw-group" type="button" tabindex="1"><img alt="Figure 2" loading="lazy" width="100" height="100" decoding="async" data-nimg="1" class="tw-mb-2 tw-border-2 tw-border-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F52d833fc5a18f33562054c36.png%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F52d833fc5a18f33562054c36.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F52d833fc5a18f33562054c36.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 2</p></button><button class="tw-mb-4 tw-mr-4 focus:tw-outline-none tw-group" type="button" tabindex="2"><img alt="Figure 3" loading="lazy" width="100" height="100" decoding="async" data-nimg="1" class="tw-mb-2 tw-border-2 tw-border-gray-100 tw-rounded-lg group-hover:tw-border-gray-200" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F4435a658d961b5524fc4f076.png%3FmaxDims%3D150x150&amp;w=128&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F4435a658d961b5524fc4f076.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-10439106%2Fv1%2F4435a658d961b5524fc4f076.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 3</p></button></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Introduction</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Alpha-gal syndrome (AGS) is an immunoglobulin E (IgE) mediated allergy directed not against a protein but against a carbohydrate: galactose-α-1,3-galactose (alpha-gal), an oligosaccharide on the glycoproteins and glycolipids of all non primate mammals. Humans lack the enzyme to synthesize alpha-gal and mount a natural antibody response against it. The syndrome was recognized when patients with anaphylaxis to the monoclonal antibody cetuximab were found to carry pre-existing IgE against an alpha-gal epitope [<span citationid="CR1" class="CitationRef">1</span>]. These antibodies are induced by tick bites and cross-react with mammalian (&ldquo;red&rdquo;) meat, producing a characteristically delayed anaphylaxis three to six hours after ingestion, a temporal pattern distinguishing AGS from nearly every other food allergy [<span citationid="CR2" class="CitationRef">2</span>].</p> <p>AGS has become a substantial public health concern. The U.S. Centers for Disease Control and Prevention identified more than 90,000 people with a positive alpha-gal IgE test between 2017 and 2022, with newly seropositive persons rising from 13,371 in 2017 to 18,885 in 2021 [<span citationid="CR3" class="CitationRef">3</span>]. Because testing requires clinical suspicion, these are considered undercounts; as many as 450,000 Americans may be affected [<span citationid="CR4" class="CitationRef">4</span>]. Serosurveillance underscores the concentrated burden: among 2024&ndash;2025 blood donors, seroprevalence reached 31.2% in Arkansas and 26.0% in Missouri [<span citationid="CR4" class="CitationRef">4</span>]. Cases mirror the range of the lone star tick (Amblyomma americanum), whose expansion, driven by climate warming, reforestation, and growing deer populations is bringing more people into contact with the sensitizing vector [<span citationid="CR3" class="CitationRef">3</span>, <span citationid="CR5" class="CitationRef">5</span>].</p> <p>Sensitization follows tick bites that drive a T-helper-2&ndash;polarized response and class switching to alpha-gal specific IgE [<span citationid="CR2" class="CitationRef">2</span>]. On re-exposure, alpha-gal cross links IgE on mast cells and basophils. The characteristic delay reflects glycolipid bound presentation: dietary alpha-gal must be processed into circulating lipoproteins before reaching effector cells [<span citationid="CR6" class="CitationRef">6</span>]. Only lipid bound and not protein bound alpha-gal is efficiently transported intact across enterocytes as an IgE-reactive molecule, a finding central to the hypotheses below [<span citationid="CR7" class="CitationRef">7</span>]. Manifestations range from urticaria to isolated gastrointestinal distress to anaphylaxis; gastrointestinal predominant disease is common and easily mistaken for functional gut disorders [<span citationid="CR8" class="CitationRef">8</span>].</p> <p>There is no cure and no disease modifying therapy for AGS. Management rests on avoidance of mammalian products and prevention of further tick bites, with acute reactions treated by antihistamines and epinephrine [<span citationid="CR9" class="CitationRef">9</span>]. Mechanistically rational options - anti-IgE therapy (omalizumab, FDA-approved in 2024 for IgE-mediated food allergy) and allergen specific OIT, remain, for AGS specifically, off-label, expensive, or confined to case reports, and there has been an explicit call for treatment trials rather than tick-prevention messaging alone [<span citationid="CR9" class="CitationRef">9</span>, <span citationid="CR10" class="CitationRef">10</span>]. This gap defines a clear need for affordable options, for which drug repurposing leveraging drugs with established safety and low cost is a rational strategy.</p> <p>The bottleneck in addressing a niche disease is rarely the availability of approved drugs; it is the human capacity to synthesize a fragmented, cross disciplinary literature into specific, testable hypotheses. Multiagent &ldquo;AI scientist&rdquo; systems have recently been proposed to compress this step. Google's AI co-scientist, built on the Gemini model, was introduced in 2025 as a collaborator that iteratively generates, debates, and evolves hypotheses aligned to a scientist provided objective, grounding its reasoning in literature search and reporting experimentally confirmed outputs.[<span citationid="CR11" class="CitationRef">11</span>, <span citationid="CR12" class="CitationRef">12</span>]. Here we describe a physician led application of this tool to find treatment options for AGS and critically appraise both the candidate drugs it produced and the workflow itself as a model for clinician driven, AI assisted discovery in neglected diseases.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Methods</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>We used Google's AI co-scientist via the experimental Hypothesis Generation tool within Gemini for Science [<span citationid="CR11" class="CitationRef">11</span>, <span citationid="CR12" class="CitationRef">12</span>]. The system is a multiagent architecture in which specialized agents divide scientific reasoning: a generation agent explores the literature and proposes hypotheses; a reflection agent performs review and verification; a ranking agent conducts pairwise &ldquo;scientific debate&rdquo; tournaments with Elo-style scoring; and evolution, proximity, and meta-review agents refine, cluster, and summarize recurring strengths and weaknesses, creating a self-improving loop [<span citationid="CR11" class="CitationRef">11</span>]. Outputs are accompanied by citations to source literature.</p> <p>Structured problem definition.</p> <p>Rather than a single prompt, the clinician engaged the system in a structured natural-language interview to converge on a well specified goal. Through this dialogue the objective was refined as induction of durable, drug-free immunological tolerance permitting a successful oral food challenge with a typical single meal quantity of mammalian protein, while excluding broadly immunosuppressive agents and monoclonal antibodies in favor of the most targeted options. Five evaluation criteria were supplied.</p> <p> <b>Clinician specified evaluation criteria.</b> </p> <p>1. Prioritize oral medications over injectables.</p> <p>2. Aim for a 3&ndash;6 month treatment duration to achieve clinical tolerance.</p> <p>3. Target medication costs under <span>$</span>100 per month where feasible.</p> <p>4. Focus on adults aged 18&ndash;65.</p> <p>5. Accept manageable side effects with appropriate patient counseling.</p> <p>Hypothesis generation and appraisal.</p> <p>Given the goal and criteria, the system autonomously mapped three solution landscapes and executed its generate&ndash;debate&ndash;evolve loop, returning a ranked research overview of eleven candidate directions plus detailed idea reports for high ranking candidates, each with an explicit hypothesis, cited mechanistic rationale, a structured protocol, and a formal evidence assessment. The clinician appraised outputs for biological plausibility, goal alignment, and safety. No laboratory, animal, or clinical validation was performed; this work reports the hypothesis generation step only. All figures are conceptual schematics of the AI-generated hypotheses and do not depict experimental data.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Results</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>From the interview, the system partitioned the problem into three complementary landscapes: (1) selective modulation of glycan-specific IgE production; (2) gastrointestinal antigen processing and mucosal-barrier stabilization; and (3) reprogramming the immune response toward tolerance. These map directly onto the delayed, lipid-associated pathophysiology of AGS [<span citationid="CR6" class="CitationRef">6</span>, <span citationid="CR7" class="CitationRef">7</span>].</p> <p>The system generated ten directions (Table&nbsp;<span refid="Tab1" class="InternalRef">1</span>), all built from inexpensive, oral, FDA-approved medications and all designed to avoid mammalian derived excipients. Metformin recurred as the backbone in seven of ten. Across directions, five convergent mechanistic themes emerged: (1) modulation of the epithelial stress response and barrier integrity via the AMPK&ndash;UPR axis; (2) regulation of lipid-mediated antigen kinetics (ezetimibe, orlistat) to slow chylomicron-borne systemic delivery; (3) pharmacologically assisted OIT using a drug &ldquo;scaffold&rdquo; to open a safe window for graded antigen exposure; (4) selective blockade of antigen entry and effector signaling (zileuton, montelukast, cromolyn); and (5) immunometabolic and nuclear-receptor reprogramming (PPAR-γ, vitamin D receptor).</p> <p> <div class="gridtable"><table float="Yes" id="Tab1" border="1"> <caption language="En"> <div class="CaptionNumber">Table 1</div> <div class="CaptionContent"> <p><b>The ten AI generated candidate directions.</b> All use oral, FDA-approved medications and mandate mammalian excipient free (compounded or liquid) formulations.</p> </div> </caption> <colgroup cols="4"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <div align="left" class="colspec" colname="c4" colnum="4"></div> <thead> <tr> <th align="left" colname="c1" morerows="1" rowspan="2"> <p>1</p> </th> <th align="left" colname="c2"> <p>Core agent(s)</p> </th> <th align="left" colname="c3"> <p>Principal proposed mechanism</p> </th> <th align="left" colname="c4"> <p>Role of combination partners</p> </th> </tr> <tr> <th align="left" colname="c2"> <p>Metformin&thinsp;+&thinsp;zileuton</p> </th> <th align="left" colname="c3"> <p>AMPK barrier restoration&thinsp;+&thinsp;5-LOX closure of GAPs during lipid-depleted OIT</p> </th> <th align="left" colname="c4"> <p>Zileuton blocks glycoprotein transport</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>2</p> </td> <td align="left" colname="c2"> <p>Metformin (+&thinsp;non-fat beef protein isolate OIT)</p> </td> <td align="left" colname="c3"> <p>AMPK/UPR suppression&thinsp;+&thinsp;FcεRI-mediated mast-cell stabilization</p> </td> <td align="left" colname="c4"> <p>Antigen source engineered to be lipid-free</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>3</p> </td> <td align="left" colname="c2"> <p>Metformin&thinsp;+&thinsp;zileuton&thinsp;+&thinsp;ezetimibe</p> </td> <td align="left" colname="c3"> <p>UPR&thinsp;+&thinsp;5-LOX&thinsp;+&thinsp;NPC1L1/ApoB-48 chylomicron blockade</p> </td> <td align="left" colname="c4"> <p>Triple blockade of entry and transport</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>4</p> </td> <td align="left" colname="c2"> <p>Metformin&thinsp;+&thinsp;pioglitazone</p> </td> <td align="left" colname="c3"> <p>AMPK/mTORC1 (&darr;IgE, &uarr;Treg) + PPAR-γ mast-cell/eosinophil stabilization</p> </td> <td align="left" colname="c4"> <p>Upstream&thinsp;+&thinsp;downstream immunometabolic control</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>5</p> </td> <td align="left" colname="c2"> <p>Metformin (+&thinsp;phased skim-milk&rarr;meat OIT)</p> </td> <td align="left" colname="c3"> <p>AMPK-mediated mucosal reprogramming; chronotherapeutic dosing; pause-and-challenge algorithm</p> </td> <td align="left" colname="c4"> <p>Structured glycoprotein&rarr;glycolipid antigen ladder</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>6</p> </td> <td align="left" colname="c2"> <p>Metformin (monotherapy scaffold)</p> </td> <td align="left" colname="c3"> <p>UPR antagonism&thinsp;+&thinsp;tight-junction fortification &rarr; Treg/IgG/IgA</p> </td> <td align="left" colname="c4">&nbsp;</td> </tr> <tr> <td align="left" colname="c1"> <p>7</p> </td> <td align="left" colname="c2"> <p>Metformin&thinsp;+&thinsp;montelukast&thinsp;+&thinsp;fexofenadine</p> </td> <td align="left" colname="c3"> <p>AMPK barrier&thinsp;+&thinsp;CysLTR1/H1 symptomatic shielding during tri-phasic OIT</p> </td> <td align="left" colname="c4"> <p>Antihistamine/anti-leukotriene cover</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>8</p> </td> <td align="left" colname="c2"> <p>Metformin&thinsp;+&thinsp;ursodiol&thinsp;+&thinsp;oral cromolyn</p> </td> <td align="left" colname="c3"> <p>Dual chemical-chaperone UPR suppression&thinsp;+&thinsp;Tfh inhibition&thinsp;+&thinsp;mast-cell stabilization</p> </td> <td align="left" colname="c4"> <p>Redundant barrier protection&thinsp;+&thinsp;effector shield</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>9</p> </td> <td align="left" colname="c2"> <p>Calcitriol&thinsp;+&thinsp;USP gelatin (sublingual)</p> </td> <td align="left" colname="c3"> <p>VDR-programmed tolerogenic dendritic cells &rarr; IgG4/IgA epitope masking</p> </td> <td align="left" colname="c4"> <p>H1/H2 blockade&thinsp;+&thinsp;epinephrine for safety</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>10</p> </td> <td align="left" colname="c2"> <p>Pioglitazone&thinsp;+&thinsp;zileuton</p> </td> <td align="left" colname="c3"> <p>PPAR-γ&ndash;mediated p-STAT6 degradation (&darr;IgE)&thinsp;+&thinsp;5-LOX barrier shield</p> </td> <td align="left" colname="c4"> <p>Nonmetformin alternative backbone</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>The top ranked hypothesis was metformin guided phased OIT. The highest ranked proposal hypothesizes that dietary saturated fat drives enterocyte endoplasmic reticulum stress and the unfolded-protein response (UPR), releasing pro-allergic alarmins (IL-25, IL-33, TSLP) and destabilizing tight junctions, preventing tolerance. Metformin, by activating AMP-activated protein kinase (AMPK), is proposed to suppress this UPR and reseal the barrier [<span citationid="CR13" class="CitationRef">13</span>, <span citationid="CR14" class="CitationRef">14</span>], creating a non-inflammatory scaffold during which a graded OIT, advancing from lipid poor skim-milk glycoproteins to solid mammalian glycolipids - drives Foxp3⁺ regulatory T cells and protective IgG4 &ldquo;blocking&rdquo; antibodies. Because only lipid-bound alpha-gal crosses enterocytes intact, the glycoprotein first sequence is a physiologically safer entry point [<span citationid="CR7" class="CitationRef">7</span>]. The scaffold is then tapered, with success defined by a double-blind, placebo-controlled oral food challenge after drug withdrawal (Fig.&nbsp;<span refid="Fig1" class="InternalRef">1</span>).</p> <p>  </p> <p>Combination strategies.</p> <p>A dual shield strategy adds zileuton, a 5-lipoxygenase inhibitor hypothesized to close goblet cell associated antigen passages and limit transcellular flooding of alpha-gal glycoproteins while metformin restores the barrier (Fig.&nbsp;<span refid="Fig2" class="InternalRef">2</span>). A triple &ldquo;double-chaperone&rdquo; strategy combines metformin and ursodiol, both acting as chemical chaperones to suppress the lipid-induced UPR with oral cromolyn for localized mast-cell stabilization, aiming to lower IgE titers over a 3&ndash;6 month window (Fig.&nbsp;<span refid="Fig3" class="InternalRef">3</span>). A separate triple regimen (metformin&thinsp;+&thinsp;zileuton&thinsp;+&thinsp;ezetimibe) adds NPC1L1-mediated attenuation of chylomicron assembly. Pioglitazone and calcitriol featured in further directions targeting effector cell stabilization and tolerogenic dendritic-cell programming.</p> <p>  </p> <p>  </p> <p>The system critiqued its own proposals. A distinctive output feature was self critique. For the lead candidate, the review agent found no critical flaws but flagged specific risks: a dangerous maintenance to challenge dose mismatch (a maintenance phase of 50 g lean meat concluding with a 150 g high-fat challenge, leaving the patient un-desensitized to the lipid bolus that drives delayed anaphylaxis); a &ldquo;chylomicron-suppression paradox&rdquo; (metformin's suppression of apoB-48/chylomicron secretion could, if too complete, prevent generation of systemic blocking IgG4); a gastrointestinal-mimicry and attrition risk (metformin's GI side effects mimic the GI-predominant AGS phenotype); and a diamine oxidase inhibition caveat.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Discussion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>The logic the system converged on is internally coherent and tailored to AGS-specific biology. Metformin turned out to meet the selection criteria: an inexpensive, oral biguanide with a decades long safety record whose activation of AMPK is independently documented to suppress the enterocyte UPR and protect intestinal-barrier integrity through AMPKα1-dependent inhibition of JNK signaling [<span citationid="CR13" class="CitationRef">13</span>, <span citationid="CR14" class="CitationRef">14</span>]. Repurposing it as a temporary mucosal scaffold to open a tolerogenic OIT window is plausible and cheap; liquid formulations avoid mammalian excipients (e.g., magnesium stearate, lactose) that themselves carry trace alpha-gal and can trigger iatrogenic reactions [<span citationid="CR15" class="CitationRef">15</span>]. The class benefits are low cost, oral administration, a familiar safety profile, and a targeted, non-immunosuppressive mechanism. The principal risks are metformin's dose dependent gastrointestinal effects, which in 20&ndash;30% of patients mimic the GI-predominant AGS phenotype seen in up to ~&thinsp;40% [<span citationid="CR16" class="CitationRef">16</span>], threatening diagnostic clarity and adherence; and the biologically real chylomicron-suppression paradox. Success is plausible but not assured, the strongest human signal remission in bariatric patients incidentally taking metformin is confounded by surgery itself, and the supporting UPR-to-tolerance evidence is largely murine and in vitro[<span citationid="CR17" class="CitationRef">17</span>]. The system's own fragility assessment rated these as the points most likely to break the hypothesis.</p> <p>The combination strategies trade feasibility for redundancy and safety shielding. Adding zileuton, ezetimibe, ursodiol, cromolyn, or montelukast/fexofenadine each targets a distinct node of the delayed anaphylaxis cascade, and several push the regimen over <span>$</span>20/month. The cost is pharmacokinetic and practical, more drug interactions, greater side effect burden, mandatory custom compounding for excipient safety, and reduced adherence. Two combination specific claims are especially speculative and need direct testing: that zileuton meaningfully closes goblet cell antigen passages in humans, and that leukotriene or PPAR-γ&ndash;axis modulation suppresses alpha-gal&ndash;specific IgE in vivo. On balance, a metformin anchored monotherapy scaffold is the most defensible first test- maximal feasibility, cleanest attribution, lowest interaction risk with combinations reserved for a later stage. None of these regimens are validated, and none constitutes clinical guidance; any patient use would require formal trials, institutional review, and anaphylaxis ready management by qualified clinicians. Benefits and risks of leading strategies are listed in Table&nbsp;<span refid="Tab2" class="InternalRef">2</span>.</p> <p> <div class="gridtable"><table float="Yes" id="Tab2" border="1"> <caption language="En"> <div class="CaptionNumber">Table 2</div> <div class="CaptionContent"> <p>Benefit risk appraisal of leading strategy tiers</p> </div> </caption> <colgroup cols="4"> <div align="left" class="colspec" colname="c1" colnum="1"></div> <div align="left" class="colspec" colname="c2" colnum="2"></div> <div align="left" class="colspec" colname="c3" colnum="3"></div> <div align="left" class="colspec" colname="c4" colnum="4"></div> <thead> <tr> <th align="left" colname="c1"> <p>Strategy</p> </th> <th align="left" colname="c2"> <p>Key benefits</p> </th> <th align="left" colname="c3"> <p>Principal risks</p> </th> <th align="left" colname="c4"> <p>Likelihood</p> </th> </tr> </thead> <tbody> <tr> <td align="left" colname="c1"> <p>Metformin monotherapy scaffold</p> </td> <td align="left" colname="c2"> <p>Cheapest; oral; strong safety record; clean attribution</p> </td> <td align="left" colname="c3"> <p>GI intolerance mimicking AGS; chylomicron paradox; confounded human evidence</p> </td> <td align="left" colname="c4"> <p>Moderate- best first test</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Dual (metformin&thinsp;+&thinsp;zileuton)</p> </td> <td align="left" colname="c2"> <p>Adds transport blockade during risky OIT escalation</p> </td> <td align="left" colname="c3"> <p>Zileuton hepatotoxicity/monitoring; GAP-closure unproven in humans</p> </td> <td align="left" colname="c4"> <p>Low -moderate</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Triple (metformin&thinsp;+&thinsp;ursodiol&thinsp;+&thinsp;cromolyn / + ezetimibe)</p> </td> <td align="left" colname="c2"> <p>Redundant UPR suppression&thinsp;+&thinsp;effector shielding</p> </td> <td align="left" colname="c3"> <p>Polypharmacy; interactions; compounding cost; weakest evidence</p> </td> <td align="left" colname="c4"> <p>Low - reserve for later stage</p> </td> </tr> <tr> <td align="left" colname="c1"> <p>Nuclear-receptor (pioglitazone, calcitriol)</p> </td> <td align="left" colname="c2"> <p>Directly targets IgE class-switching / tolerogenic DCs</p> </td> <td align="left" colname="c3"> <p>PPAR-γ agonist safety; IgE-suppression claims speculative</p> </td> <td align="left" colname="c4"> <p>Low - least mature</p> </td> </tr> </tbody> </colgroup> </table></div> </p> <p>The exercise illustrates three useful features. First, the structured interview forced early specification of what &ldquo;success&rdquo; means (a passed oral food challenge, not merely lower IgE) and of hard constraints, disciplining the entire search, an informatics analogue of a well formed clinical question. Second, the generate&ndash;debate&ndash;evolve architecture produced not one answer but a ranked landscape with convergent themes, letting the clinician see why metformin recurred. Third, and most valuable for safety critical medicine, the system surfaced its own failure modes. For a single physician confronting a neglected disease, compressing weeks of synthesis into a structured, self-critiqued hypothesis set materially lowers the barrier to investigator initiated research.</p> <p>Limitations</p> <p>These strengths must be read against firm limits. The outputs are hypotheses, not evidence; several mechanistic links are unproven and the most direct human signal is confounded. Generative systems can misattribute or fabricate citations, so every reference in an AI-generated proposal requires independent verification, a step we treated as mandatory. We did not benchmark the tool: this is a single case demonstration with no ground truth, no comparison against expert generated hypotheses, and no inter-rater appraisal, so we cannot quantify novelty or accuracy; the internal Elo rankings are auto-evaluations and do not reflect external validity. Appraisal by a single clinician introduces confirmation bias toward mechanistically attractive but unvalidated ideas. The essential next steps are validation, not implementation: the AI-proposed roadmap itself prioritizes ex vivo confirmation (basophil activation tests, human intestinal organoids) and preclinical work (e.g., α-1,3-galactosyltransferase knockout models) before any safety-focused Phase Ib trial, which would demand IRB oversight and regulatory engagement for off-label and compounded agents.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Conclusion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Used as a disciplined, physician-in-the-loop partner, a generative AI co-scientist rapidly transformed a bedside clinical question about an under researched disease into a ranked, mechanistically explicit, and internally critiqued set of drug-repurposing hypotheses that honored real-world constraints of route, cost, duration, and safety. The leading candidate, a metformin guided, phased oral immunotherapy scaffold is biologically coherent, inexpensive, and testable, and the tool's own identification of its pitfalls models the self-critique that safety critical medicine demands. The value of the approach lies not in the answers themselves but in how quickly and transparently it brings a neglected problem to the threshold of rigorous investigation.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Declarations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><h2>Funding:</h2> <p>None. Competing interests: None declared. Ethics: This work describes a hypothesis generation exercise using a publicly accessible AI tool; no human subjects, patient data, or interventions were involved, and no ethics approval was required. Data availability: The AI co-scientist prompts and output reports are available from the corresponding author on reasonable request.</p> <p>Author's note on AI use: The candidate hypotheses, mechanistic rationales, and the schematic figures reported here were generated by Google's AI co-scientist / Hypothesis Generation tool [<span citationid="CR11" class="CitationRef">11</span>, <span citationid="CR12" class="CitationRef">12</span>] in response to author prompts, and are reported as the object of study. All AI-generated content, including cited literature, was independently verified against primary sources before inclusion. This manuscript describes a hypothesis generation exercise; it does not report validated findings and is not clinical guidance.</p></div></ R5jljBsSHeXhupKXdlm1Lzp1xhs3YIrEtWbIBhxY+9h4zyR8Vh+XYZyQfu/nmj11ufw/zwxsf2+z4cdkCAzzIHBaJBELq0QHzB1J1jIJRMApGwbAGADveUrrys0riAAAAAElFTkSuQmCC","orcid":"https://orcid.org/0000-0003-3540-4913","institution":"Mercy Hospital","correspondingAuthor":true,"submittingAuthor":true,"prefix":"","firstName":"Johnson","middleName":"","lastName":"Thomas","suffix":""}],"badges":[],"createdAt":"2026-07-22 00:35:51","currentVersionCode":1,"declarations":{"humanSubjects":false,"vertebrateSubjects":false,"conflictsOfInterestStatement":false,"humanSubjectEthicalGuidelines":false,"humanSubjectConsent":false,"humanSubjectClinicalTrial":false,"humanSubjectCaseReport":false,"vertebrateSubjectEthicalGuidelines":false,"coiExplicitlySet":true},"doi":"10.21203/rs.3.rs-10439106/v1","doiUrl":"https://doi.org/10.21203/rs.3.rs-10439106/v1","draftVersion":[],"editorialEvents":[],"editorialNote":"","failedWorkflow":false,"files":[{"id":115465785,"identity":"c96f4980-09af-4f80-966e-a85dbf22a76c","added_by":"auto","created_at":"2026-07-23 11:28:31","extension":"png","order_by":1,"title":"Figure 1","display":"","copyAsset":false,"role":"figure","size":210944,"visible":true,"origin":"","legend":"\u003cp\u003eConceptual schematic of a metformin guided, phased oral-immunotherapy protocol. Metformin activates AMPK, suppresses the enterocyte UPR, and stabilizes tight-junction proteins (ZO-1, occludin) to create a tolerogenic mucosa; antigen is introduced in phases from low-fat skim-milk glycoproteins to mammalian-meat glycolipids, driving Foxp3⁺ regulatory T cells and protective IgG4 antibodies.\u003c/p\u003e","description":"","filename":"floatimage1.png","url":"https://assets-eu.researchsquare.com/files/rs-10439106/v1/703492f1de29ab87c7ea82ef.png"},{"id":115435455,"identity":"23435a08-ebad-49d2-b83c-dc9004101499","added_by":"auto","created_at":"2026-07-23 06:48:06","extension":"png","order_by":2,"title":"Figure 2","display":"","copyAsset":false,"role":"figure","size":242587,"visible":true,"origin":"","legend":"\u003cp\u003eThe dual shield mechanism (metformin + zileuton): metformin restores enterocyte tight junctions while zileuton is hypothesized to close goblet-cell-associated antigen passages, blocking the transcellular route by which alpha-gal glycoproteins reach the lamina propria; tolerogenic dendritic-cell sampling is preserved.\u003c/p\u003e","description":"","filename":"floatimage2.png","url":"https://assets-eu.researchsquare.com/files/rs-10439106/v1/52d833fc5a18f33562054c36.png"},{"id":115435457,"identity":"34035787-6297-4c0d-a19a-bd0b1f1107f5","added_by":"auto","created_at":"2026-07-23 06:48:06","extension":"png","order_by":3,"title":"Figure 3","display":"","copyAsset":false,"role":"figure","size":220701,"visible":true,"origin":"","legend":"\u003cp\u003eThe triple-drug “double-chaperone” protocol (metformin + ursodiol + oral cromolyn): redundant suppression of the enterocyte UPR and barrier restoration, plus mast cell coating to prevent histamine release, with intended progressive depletion of alpha-gal specific IgE.\u003c/p\u003e","description":"","filename":"floatimage3.png","url":"https://assets-eu.researchsquare.com/files/rs-10439106/v1/4435a658d961b5524fc4f076.png"},{"id":115466519,"identity":"2712ff22-8499-43a3-89f7-906c948188cd","added_by":"auto","created_at":"2026-07-23 11:30:22","extension":"pdf","order_by":0,"title":"","display":"","copyAsset":false,"role":"manuscript-pdf","size":839121,"visible":true,"origin":"","legend":"","description":"","filename":"manuscript.pdf","url":"https://assets-eu.researchsquare.com/files/rs-10439106/v1/084c82f9-45e0-44b9-a12c-4693b17bf211.pdf"}],"financialInterests":"The authors declare no competing interests.","formattedTitle":"\u003cp\u003e\u003cstrong\u003eFrom Clinical Question to Testable Hypothesis: Using AI Co-Scientist to Identify Repurposable Drugs for Alpha-Gal Syndrome\u003c/strong\u003e\u003c/p\u003e","fulltext":[{"header":"Introduction","content":"\u003cp\u003eAlpha-gal syndrome (AGS) is an immunoglobulin E (IgE) mediated allergy directed not against a protein but against a carbohydrate: galactose-α-1,3-galactose (alpha-gal), an oligosaccharide on the glycoproteins and glycolipids of all non primate mammals. Humans lack the enzyme to synthesize alpha-gal and mount a natural antibody response against it. The syndrome was recognized when patients with anaphylaxis to the monoclonal antibody cetuximab were found to carry pre-existing IgE against an alpha-gal epitope [\u003cspan citationid=\"CR1\" class=\"CitationRef\"\u003e1\u003c/span\u003e]. These antibodies are induced by tick bites and cross-react with mammalian (\u0026ldquo;red\u0026rdquo;) meat, producing a characteristically delayed anaphylaxis three to six hours after ingestion, a temporal pattern distinguishing AGS from nearly every other food allergy [\u003cspan citationid=\"CR2\" class=\"CitationRef\"\u003e2\u003c/span\u003e].\u003c/p\u003e \u003cp\u003eAGS has become a substantial public health concern. The U.S. Centers for Disease Control and Prevention identified more than 90,000 people with a positive alpha-gal IgE test between 2017 and 2022, with newly seropositive persons rising from 13,371 in 2017 to 18,885 in 2021 [\u003cspan citationid=\"CR3\" class=\"CitationRef\"\u003e3\u003c/span\u003e]. Because testing requires clinical suspicion, these are considered undercounts; as many as 450,000 Americans may be affected [\u003cspan citationid=\"CR4\" class=\"CitationRef\"\u003e4\u003c/span\u003e]. Serosurveillance underscores the concentrated burden: among 2024\u0026ndash;2025 blood donors, seroprevalence reached 31.2% in Arkansas and 26.0% in Missouri [\u003cspan citationid=\"CR4\" class=\"CitationRef\"\u003e4\u003c/span\u003e]. Cases mirror the range of the lone star tick (Amblyomma americanum), whose expansion, driven by climate warming, reforestation, and growing deer populations is bringing more people into contact with the sensitizing vector [\u003cspan citationid=\"CR3\" class=\"CitationRef\"\u003e3\u003c/span\u003e, \u003cspan citationid=\"CR5\" class=\"CitationRef\"\u003e5\u003c/span\u003e].\u003c/p\u003e \u003cp\u003eSensitization follows tick bites that drive a T-helper-2\u0026ndash;polarized response and class switching to alpha-gal specific IgE [\u003cspan citationid=\"CR2\" class=\"CitationRef\"\u003e2\u003c/span\u003e]. On re-exposure, alpha-gal cross links IgE on mast cells and basophils. The characteristic delay reflects glycolipid bound presentation: dietary alpha-gal must be processed into circulating lipoproteins before reaching effector cells [\u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e6\u003c/span\u003e]. Only lipid bound and not protein bound alpha-gal is efficiently transported intact across enterocytes as an IgE-reactive molecule, a finding central to the hypotheses below [\u003cspan citationid=\"CR7\" class=\"CitationRef\"\u003e7\u003c/span\u003e]. Manifestations range from urticaria to isolated gastrointestinal distress to anaphylaxis; gastrointestinal predominant disease is common and easily mistaken for functional gut disorders [\u003cspan citationid=\"CR8\" class=\"CitationRef\"\u003e8\u003c/span\u003e].\u003c/p\u003e \u003cp\u003eThere is no cure and no disease modifying therapy for AGS. Management rests on avoidance of mammalian products and prevention of further tick bites, with acute reactions treated by antihistamines and epinephrine [\u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e9\u003c/span\u003e]. Mechanistically rational options - anti-IgE therapy (omalizumab, FDA-approved in 2024 for IgE-mediated food allergy) and allergen specific OIT, remain, for AGS specifically, off-label, expensive, or confined to case reports, and there has been an explicit call for treatment trials rather than tick-prevention messaging alone [\u003cspan citationid=\"CR9\" class=\"CitationRef\"\u003e9\u003c/span\u003e, \u003cspan citationid=\"CR10\" class=\"CitationRef\"\u003e10\u003c/span\u003e]. This gap defines a clear need for affordable options, for which drug repurposing leveraging drugs with established safety and low cost is a rational strategy.\u003c/p\u003e \u003cp\u003eThe bottleneck in addressing a niche disease is rarely the availability of approved drugs; it is the human capacity to synthesize a fragmented, cross disciplinary literature into specific, testable hypotheses. Multiagent \u0026ldquo;AI scientist\u0026rdquo; systems have recently been proposed to compress this step. Google's AI co-scientist, built on the Gemini model, was introduced in 2025 as a collaborator that iteratively generates, debates, and evolves hypotheses aligned to a scientist provided objective, grounding its reasoning in literature search and reporting experimentally confirmed outputs.[\u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e11\u003c/span\u003e, \u003cspan citationid=\"CR12\" class=\"CitationRef\"\u003e12\u003c/span\u003e]. Here we describe a physician led application of this tool to find treatment options for AGS and critically appraise both the candidate drugs it produced and the workflow itself as a model for clinician driven, AI assisted discovery in neglected diseases.\u003c/p\u003e"},{"header":"Methods","content":"\u003cp\u003eWe used Google's AI co-scientist via the experimental Hypothesis Generation tool within Gemini for Science [\u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e11\u003c/span\u003e, \u003cspan citationid=\"CR12\" class=\"CitationRef\"\u003e12\u003c/span\u003e]. The system is a multiagent architecture in which specialized agents divide scientific reasoning: a generation agent explores the literature and proposes hypotheses; a reflection agent performs review and verification; a ranking agent conducts pairwise \u0026ldquo;scientific debate\u0026rdquo; tournaments with Elo-style scoring; and evolution, proximity, and meta-review agents refine, cluster, and summarize recurring strengths and weaknesses, creating a self-improving loop [\u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e11\u003c/span\u003e]. Outputs are accompanied by citations to source literature.\u003c/p\u003e \u003cp\u003eStructured problem definition.\u003c/p\u003e \u003cp\u003eRather than a single prompt, the clinician engaged the system in a structured natural-language interview to converge on a well specified goal. Through this dialogue the objective was refined as induction of durable, drug-free immunological tolerance permitting a successful oral food challenge with a typical single meal quantity of mammalian protein, while excluding broadly immunosuppressive agents and monoclonal antibodies in favor of the most targeted options. Five evaluation criteria were supplied.\u003c/p\u003e \u003cp\u003e \u003cb\u003eClinician specified evaluation criteria.\u003c/b\u003e \u003c/p\u003e \u003cp\u003e1. Prioritize oral medications over injectables.\u003c/p\u003e \u003cp\u003e2. Aim for a 3\u0026ndash;6 month treatment duration to achieve clinical tolerance.\u003c/p\u003e \u003cp\u003e3. Target medication costs under \u003cspan\u003e$\u003c/span\u003e100 per month where feasible.\u003c/p\u003e \u003cp\u003e4. Focus on adults aged 18\u0026ndash;65.\u003c/p\u003e \u003cp\u003e5. Accept manageable side effects with appropriate patient counseling.\u003c/p\u003e \u003cp\u003eHypothesis generation and appraisal.\u003c/p\u003e \u003cp\u003eGiven the goal and criteria, the system autonomously mapped three solution landscapes and executed its generate\u0026ndash;debate\u0026ndash;evolve loop, returning a ranked research overview of eleven candidate directions plus detailed idea reports for high ranking candidates, each with an explicit hypothesis, cited mechanistic rationale, a structured protocol, and a formal evidence assessment. The clinician appraised outputs for biological plausibility, goal alignment, and safety. No laboratory, animal, or clinical validation was performed; this work reports the hypothesis generation step only. All figures are conceptual schematics of the AI-generated hypotheses and do not depict experimental data.\u003c/p\u003e"},{"header":"Results","content":"\u003cp\u003eFrom the interview, the system partitioned the problem into three complementary landscapes: (1) selective modulation of glycan-specific IgE production; (2) gastrointestinal antigen processing and mucosal-barrier stabilization; and (3) reprogramming the immune response toward tolerance. These map directly onto the delayed, lipid-associated pathophysiology of AGS [\u003cspan citationid=\"CR6\" class=\"CitationRef\"\u003e6\u003c/span\u003e, \u003cspan citationid=\"CR7\" class=\"CitationRef\"\u003e7\u003c/span\u003e].\u003c/p\u003e \u003cp\u003eThe system generated ten directions (Table\u0026nbsp;\u003cspan refid=\"Tab1\" class=\"InternalRef\"\u003e1\u003c/span\u003e), all built from inexpensive, oral, FDA-approved medications and all designed to avoid mammalian derived excipients. Metformin recurred as the backbone in seven of ten. Across directions, five convergent mechanistic themes emerged: (1) modulation of the epithelial stress response and barrier integrity via the AMPK\u0026ndash;UPR axis; (2) regulation of lipid-mediated antigen kinetics (ezetimibe, orlistat) to slow chylomicron-borne systemic delivery; (3) pharmacologically assisted OIT using a drug \u0026ldquo;scaffold\u0026rdquo; to open a safe window for graded antigen exposure; (4) selective blockade of antigen entry and effector signaling (zileuton, montelukast, cromolyn); and (5) immunometabolic and nuclear-receptor reprogramming (PPAR-γ, vitamin D receptor).\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab1\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 1\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003e\u003cb\u003eThe ten AI generated candidate directions.\u003c/b\u003e All use oral, FDA-approved medications and mandate mammalian excipient free (compounded or liquid) formulations.\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"4\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\" morerows=\"1\" rowspan=\"2\"\u003e \u003cp\u003e1\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eCore agent(s)\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003ePrincipal proposed mechanism\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003eRole of combination partners\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin\u0026thinsp;+\u0026thinsp;zileuton\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003eAMPK barrier restoration\u0026thinsp;+\u0026thinsp;5-LOX closure of GAPs during lipid-depleted OIT\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003eZileuton blocks glycoprotein transport\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e2\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin (+\u0026thinsp;non-fat beef protein isolate OIT)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eAMPK/UPR suppression\u0026thinsp;+\u0026thinsp;FcεRI-mediated mast-cell stabilization\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eAntigen source engineered to be lipid-free\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e3\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin\u0026thinsp;+\u0026thinsp;zileuton\u0026thinsp;+\u0026thinsp;ezetimibe\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUPR\u0026thinsp;+\u0026thinsp;5-LOX\u0026thinsp;+\u0026thinsp;NPC1L1/ApoB-48 chylomicron blockade\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eTriple blockade of entry and transport\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e4\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin\u0026thinsp;+\u0026thinsp;pioglitazone\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eAMPK/mTORC1 (\u0026darr;IgE, \u0026uarr;Treg) + PPAR-γ mast-cell/eosinophil stabilization\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eUpstream\u0026thinsp;+\u0026thinsp;downstream immunometabolic control\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e5\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin (+\u0026thinsp;phased skim-milk\u0026rarr;meat OIT)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eAMPK-mediated mucosal reprogramming; chronotherapeutic dosing; pause-and-challenge algorithm\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eStructured glycoprotein\u0026rarr;glycolipid antigen ladder\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e6\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin (monotherapy scaffold)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eUPR antagonism\u0026thinsp;+\u0026thinsp;tight-junction fortification \u0026rarr; Treg/IgG/IgA\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e\u0026nbsp;\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e7\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin\u0026thinsp;+\u0026thinsp;montelukast\u0026thinsp;+\u0026thinsp;fexofenadine\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eAMPK barrier\u0026thinsp;+\u0026thinsp;CysLTR1/H1 symptomatic shielding during tri-phasic OIT\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eAntihistamine/anti-leukotriene cover\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e8\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eMetformin\u0026thinsp;+\u0026thinsp;ursodiol\u0026thinsp;+\u0026thinsp;oral cromolyn\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eDual chemical-chaperone UPR suppression\u0026thinsp;+\u0026thinsp;Tfh inhibition\u0026thinsp;+\u0026thinsp;mast-cell stabilization\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eRedundant barrier protection\u0026thinsp;+\u0026thinsp;effector shield\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e9\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eCalcitriol\u0026thinsp;+\u0026thinsp;USP gelatin (sublingual)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eVDR-programmed tolerogenic dendritic cells \u0026rarr; IgG4/IgA epitope masking\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eH1/H2 blockade\u0026thinsp;+\u0026thinsp;epinephrine for safety\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003e10\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003ePioglitazone\u0026thinsp;+\u0026thinsp;zileuton\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003ePPAR-γ\u0026ndash;mediated p-STAT6 degradation (\u0026darr;IgE)\u0026thinsp;+\u0026thinsp;5-LOX barrier shield\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eNonmetformin alternative backbone\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eThe top ranked hypothesis was metformin guided phased OIT. The highest ranked proposal hypothesizes that dietary saturated fat drives enterocyte endoplasmic reticulum stress and the unfolded-protein response (UPR), releasing pro-allergic alarmins (IL-25, IL-33, TSLP) and destabilizing tight junctions, preventing tolerance. Metformin, by activating AMP-activated protein kinase (AMPK), is proposed to suppress this UPR and reseal the barrier [\u003cspan citationid=\"CR13\" class=\"CitationRef\"\u003e13\u003c/span\u003e, \u003cspan citationid=\"CR14\" class=\"CitationRef\"\u003e14\u003c/span\u003e], creating a non-inflammatory scaffold during which a graded OIT, advancing from lipid poor skim-milk glycoproteins to solid mammalian glycolipids - drives Foxp3⁺ regulatory T cells and protective IgG4 \u0026ldquo;blocking\u0026rdquo; antibodies. Because only lipid-bound alpha-gal crosses enterocytes intact, the glycoprotein first sequence is a physiologically safer entry point [\u003cspan citationid=\"CR7\" class=\"CitationRef\"\u003e7\u003c/span\u003e]. The scaffold is then tapered, with success defined by a double-blind, placebo-controlled oral food challenge after drug withdrawal (Fig.\u0026nbsp;\u003cspan refid=\"Fig1\" class=\"InternalRef\"\u003e1\u003c/span\u003e).\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eCombination strategies.\u003c/p\u003e \u003cp\u003eA dual shield strategy adds zileuton, a 5-lipoxygenase inhibitor hypothesized to close goblet cell associated antigen passages and limit transcellular flooding of alpha-gal glycoproteins while metformin restores the barrier (Fig.\u0026nbsp;\u003cspan refid=\"Fig2\" class=\"InternalRef\"\u003e2\u003c/span\u003e). A triple \u0026ldquo;double-chaperone\u0026rdquo; strategy combines metformin and ursodiol, both acting as chemical chaperones to suppress the lipid-induced UPR with oral cromolyn for localized mast-cell stabilization, aiming to lower IgE titers over a 3\u0026ndash;6 month window (Fig.\u0026nbsp;\u003cspan refid=\"Fig3\" class=\"InternalRef\"\u003e3\u003c/span\u003e). A separate triple regimen (metformin\u0026thinsp;+\u0026thinsp;zileuton\u0026thinsp;+\u0026thinsp;ezetimibe) adds NPC1L1-mediated attenuation of chylomicron assembly. Pioglitazone and calcitriol featured in further directions targeting effector cell stabilization and tolerogenic dendritic-cell programming.\u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003e  \u003c/p\u003e \u003cp\u003eThe system critiqued its own proposals. A distinctive output feature was self critique. For the lead candidate, the review agent found no critical flaws but flagged specific risks: a dangerous maintenance to challenge dose mismatch (a maintenance phase of 50 g lean meat concluding with a 150 g high-fat challenge, leaving the patient un-desensitized to the lipid bolus that drives delayed anaphylaxis); a \u0026ldquo;chylomicron-suppression paradox\u0026rdquo; (metformin's suppression of apoB-48/chylomicron secretion could, if too complete, prevent generation of systemic blocking IgG4); a gastrointestinal-mimicry and attrition risk (metformin's GI side effects mimic the GI-predominant AGS phenotype); and a diamine oxidase inhibition caveat.\u003c/p\u003e"},{"header":"Discussion","content":"\u003cp\u003eThe logic the system converged on is internally coherent and tailored to AGS-specific biology. Metformin turned out to meet the selection criteria: an inexpensive, oral biguanide with a decades long safety record whose activation of AMPK is independently documented to suppress the enterocyte UPR and protect intestinal-barrier integrity through AMPKα1-dependent inhibition of JNK signaling [\u003cspan citationid=\"CR13\" class=\"CitationRef\"\u003e13\u003c/span\u003e, \u003cspan citationid=\"CR14\" class=\"CitationRef\"\u003e14\u003c/span\u003e]. Repurposing it as a temporary mucosal scaffold to open a tolerogenic OIT window is plausible and cheap; liquid formulations avoid mammalian excipients (e.g., magnesium stearate, lactose) that themselves carry trace alpha-gal and can trigger iatrogenic reactions [\u003cspan citationid=\"CR15\" class=\"CitationRef\"\u003e15\u003c/span\u003e]. The class benefits are low cost, oral administration, a familiar safety profile, and a targeted, non-immunosuppressive mechanism. The principal risks are metformin's dose dependent gastrointestinal effects, which in 20\u0026ndash;30% of patients mimic the GI-predominant AGS phenotype seen in up to ~\u0026thinsp;40% [\u003cspan citationid=\"CR16\" class=\"CitationRef\"\u003e16\u003c/span\u003e], threatening diagnostic clarity and adherence; and the biologically real chylomicron-suppression paradox. Success is plausible but not assured, the strongest human signal remission in bariatric patients incidentally taking metformin is confounded by surgery itself, and the supporting UPR-to-tolerance evidence is largely murine and in vitro[\u003cspan citationid=\"CR17\" class=\"CitationRef\"\u003e17\u003c/span\u003e]. The system's own fragility assessment rated these as the points most likely to break the hypothesis.\u003c/p\u003e \u003cp\u003eThe combination strategies trade feasibility for redundancy and safety shielding. Adding zileuton, ezetimibe, ursodiol, cromolyn, or montelukast/fexofenadine each targets a distinct node of the delayed anaphylaxis cascade, and several push the regimen over \u003cspan\u003e$\u003c/span\u003e20/month. The cost is pharmacokinetic and practical, more drug interactions, greater side effect burden, mandatory custom compounding for excipient safety, and reduced adherence. Two combination specific claims are especially speculative and need direct testing: that zileuton meaningfully closes goblet cell antigen passages in humans, and that leukotriene or PPAR-γ\u0026ndash;axis modulation suppresses alpha-gal\u0026ndash;specific IgE in vivo. On balance, a metformin anchored monotherapy scaffold is the most defensible first test- maximal feasibility, cleanest attribution, lowest interaction risk with combinations reserved for a later stage. None of these regimens are validated, and none constitutes clinical guidance; any patient use would require formal trials, institutional review, and anaphylaxis ready management by qualified clinicians. Benefits and risks of leading strategies are listed in Table\u0026nbsp;\u003cspan refid=\"Tab2\" class=\"InternalRef\"\u003e2\u003c/span\u003e.\u003c/p\u003e \u003cp\u003e \u003cdiv class=\"gridtable\"\u003e\u003ctable float=\"Yes\" id=\"Tab2\" border=\"1\"\u003e \u003ccaption language=\"En\"\u003e \u003cdiv class=\"CaptionNumber\"\u003eTable 2\u003c/div\u003e \u003cdiv class=\"CaptionContent\"\u003e \u003cp\u003eBenefit risk appraisal of leading strategy tiers\u003c/p\u003e \u003c/div\u003e \u003c/caption\u003e \u003ccolgroup cols=\"4\"\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c1\" colnum=\"1\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c2\" colnum=\"2\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c3\" colnum=\"3\"\u003e\u003c/div\u003e \u003cdiv align=\"left\" class=\"colspec\" colname=\"c4\" colnum=\"4\"\u003e\u003c/div\u003e \u003cthead\u003e \u003ctr\u003e \u003cth align=\"left\" colname=\"c1\"\u003e \u003cp\u003eStrategy\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c2\"\u003e \u003cp\u003eKey benefits\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c3\"\u003e \u003cp\u003ePrincipal risks\u003c/p\u003e \u003c/th\u003e \u003cth align=\"left\" colname=\"c4\"\u003e \u003cp\u003eLikelihood\u003c/p\u003e \u003c/th\u003e \u003c/tr\u003e \u003c/thead\u003e \u003ctbody\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eMetformin monotherapy scaffold\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eCheapest; oral; strong safety record; clean attribution\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eGI intolerance mimicking AGS; chylomicron paradox; confounded human evidence\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eModerate- best first test\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eDual (metformin\u0026thinsp;+\u0026thinsp;zileuton)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eAdds transport blockade during risky OIT escalation\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003eZileuton hepatotoxicity/monitoring; GAP-closure unproven in humans\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eLow -moderate\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eTriple (metformin\u0026thinsp;+\u0026thinsp;ursodiol\u0026thinsp;+\u0026thinsp;cromolyn / + ezetimibe)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eRedundant UPR suppression\u0026thinsp;+\u0026thinsp;effector shielding\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003ePolypharmacy; interactions; compounding cost; weakest evidence\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eLow - reserve for later stage\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd align=\"left\" colname=\"c1\"\u003e \u003cp\u003eNuclear-receptor (pioglitazone, calcitriol)\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c2\"\u003e \u003cp\u003eDirectly targets IgE class-switching / tolerogenic DCs\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c3\"\u003e \u003cp\u003ePPAR-γ agonist safety; IgE-suppression claims speculative\u003c/p\u003e \u003c/td\u003e \u003ctd align=\"left\" colname=\"c4\"\u003e \u003cp\u003eLow - least mature\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/colgroup\u003e \u003c/table\u003e\u003c/div\u003e \u003c/p\u003e \u003cp\u003eThe exercise illustrates three useful features. First, the structured interview forced early specification of what \u0026ldquo;success\u0026rdquo; means (a passed oral food challenge, not merely lower IgE) and of hard constraints, disciplining the entire search, an informatics analogue of a well formed clinical question. Second, the generate\u0026ndash;debate\u0026ndash;evolve architecture produced not one answer but a ranked landscape with convergent themes, letting the clinician see why metformin recurred. Third, and most valuable for safety critical medicine, the system surfaced its own failure modes. For a single physician confronting a neglected disease, compressing weeks of synthesis into a structured, self-critiqued hypothesis set materially lowers the barrier to investigator initiated research.\u003c/p\u003e \u003cp\u003eLimitations\u003c/p\u003e \u003cp\u003eThese strengths must be read against firm limits. The outputs are hypotheses, not evidence; several mechanistic links are unproven and the most direct human signal is confounded. Generative systems can misattribute or fabricate citations, so every reference in an AI-generated proposal requires independent verification, a step we treated as mandatory. We did not benchmark the tool: this is a single case demonstration with no ground truth, no comparison against expert generated hypotheses, and no inter-rater appraisal, so we cannot quantify novelty or accuracy; the internal Elo rankings are auto-evaluations and do not reflect external validity. Appraisal by a single clinician introduces confirmation bias toward mechanistically attractive but unvalidated ideas. The essential next steps are validation, not implementation: the AI-proposed roadmap itself prioritizes ex vivo confirmation (basophil activation tests, human intestinal organoids) and preclinical work (e.g., α-1,3-galactosyltransferase knockout models) before any safety-focused Phase Ib trial, which would demand IRB oversight and regulatory engagement for off-label and compounded agents.\u003c/p\u003e"},{"header":"Conclusion","content":"\u003cp\u003eUsed as a disciplined, physician-in-the-loop partner, a generative AI co-scientist rapidly transformed a bedside clinical question about an under researched disease into a ranked, mechanistically explicit, and internally critiqued set of drug-repurposing hypotheses that honored real-world constraints of route, cost, duration, and safety. The leading candidate, a metformin guided, phased oral immunotherapy scaffold is biologically coherent, inexpensive, and testable, and the tool's own identification of its pitfalls models the self-critique that safety critical medicine demands. The value of the approach lies not in the answers themselves but in how quickly and transparently it brings a neglected problem to the threshold of rigorous investigation.\u003c/p\u003e"},{"header":"Declarations","content":"\u003ch2\u003eFunding:\u003c/h2\u003e \u003cp\u003eNone. Competing interests: None declared. Ethics: This work describes a hypothesis generation exercise using a publicly accessible AI tool; no human subjects, patient data, or interventions were involved, and no ethics approval was required. Data availability: The AI co-scientist prompts and output reports are available from the corresponding author on reasonable request.\u003c/p\u003e \u003cp\u003eAuthor's note on AI use: The candidate hypotheses, mechanistic rationales, and the schematic figures reported here were generated by Google's AI co-scientist / Hypothesis Generation tool [\u003cspan citationid=\"CR11\" class=\"CitationRef\"\u003e11\u003c/span\u003e, \u003cspan citationid=\"CR12\" class=\"CitationRef\"\u003e12\u003c/span\u003e] in response to author prompts, and are reported as the object of study. All AI-generated content, including cited literature, was independently verified against primary sources before inclusion. This manuscript describes a hypothesis generation exercise; it does not report validated findings and is not clinical guidance.\u003c/p\u003e"},{"header":"References","content":"\u003col\u003e\u003cli\u003e\u003cspan\u003eChung CH, Mirakhur B, Chan E et al (2008) Cetuximab-induced anaphylaxis and IgE specific for galactose-alpha-1,3-galactose. N Engl J Med. ;358(11):1109\u0026ndash;1117. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003e10.1056/NEJMoa074943\u003c/span\u003e\u003cspan address=\"10.1056/NEJMoa074943\" targettype=\"DOI\" class=\"RefTarget\"\u003e\u003c/span\u003e\u003c/span\u003e. PMID: 18337601\u003c/span\u003e\u003c/li\u003e \u003cli\u003e\u003cspan\u003ePlatts-Mills TAE, Gangwar RS, Workman L, Wilson JM (2025) The immunology of alpha-gal syndrome: history, tick bites, IgE, and delayed anaphylaxis to mammalian meat. Immunol Rev. \u003cspan class=\"ExternalRef\"\u003e\u003cspan class=\"RefSource\"\u003e10.1111/imr.70035\u003c/span\u003e\u003cspan address=\"10.1111/imr.70035\
