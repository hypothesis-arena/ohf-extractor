name: ohf-extractor checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: local-runner
    steps:
      - name: Require a trusted repository branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork pull requests require isolated validation before this check can pass."
          exit 1
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Check tracked source language
        run: python3.12 tools/check_language.py
      - name: Check out both supported OHF standards
        run: |
          git clone --depth 1 --branch v1.0.1 \
            https://github.com/hypothesis-arena/open-hypothesis-format.git standard
          git clone --depth 1 --branch v1.1.4 \
            https://github.com/hypothesis-arena/open-hypothesis-format.git standard-1.1.4
          test "$(git -C standard rev-parse HEAD)" = e3cd86c0386ce618187a786ecc78293332d5f462
          test "$(git -C standard-1.1.4 rev-parse HEAD)" = fc554f691d6cf0092182bb306c769c5e217f6165
      - name: Check out the optional research companion standard
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ol/open-hypothesis-format
          token: ${{ secrets.OHF_STANDARD_READ_TOKEN }}
          github-server-url: ${{ github.server_url }}
          ref: 0b6f5ef1003f696220d8bb0b8316260825e4a10c
          path: standard-research
          persist-credentials: false
      - name: Verify the research companion source association
        run: |
          test "$(git -C standard-research rev-parse HEAD)" = 0b6f5ef1003f696220d8bb0b8316260825e4a10c
          test "$(git -C standard-research rev-parse HEAD^{tree})" = 22fdde400cd18e29f268c886fdb2f0c63d27b3da
          git -C standard-research diff --exit-code
      - name: Check out the active primary OHF 1.4 source
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ol/open-hypothesis-format
          token: ${{ secrets.OHF_STANDARD_READ_TOKEN }}
          github-server-url: ${{ github.server_url }}
          ref: bf1f582f977c2ac65e5537ebd9f1b1b19ae328d3
          path: standard-primary-1.4
          persist-credentials: false
      - name: Verify the active primary source before running tests
        run: |
          test "$(git -C standard-primary-1.4 rev-parse HEAD)" = bf1f582f977c2ac65e5537ebd9f1b1b19ae328d3
          test "$(git -C standard-primary-1.4 rev-parse HEAD^{tree})" = bac900f8df5c38a3ddd7efe118fce59ee0fd7931
          git -C standard-primary-1.4 diff --exit-code
      - name: Install
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Full tests against OHF 1.0.1
        env:
          OHF_REPO: ${{ github.workspace }}/standard
          OHF_RESEARCH_STANDARD: ${{ github.workspace }}/standard-research
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -q scripts/tests
      - name: Full tests against OHF 1.1.4
        env:
          OHF_REPO: ${{ github.workspace }}/standard-1.1.4
          OHF_RESEARCH_STANDARD: ${{ github.workspace }}/standard-research
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -q scripts/tests
      - name: Full tests against the active OHF 1.4 primary
        env:
          OHF_REPO: ${{ github.workspace }}/standard-primary-1.4
          OHF_RESEARCH_STANDARD: ${{ github.workspace }}/standard-research
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -q scripts/tests
      - name: Report the rules hash
        env:
          OHF_REPO: ${{ github.workspace }}/standard
        run: |
          .venv/bin/python -I -c "import sys; sys.path.insert(0, 'scripts'); import ohfkit; print(ohfkit.rules_hash())"

  native-profile-1-4:
    needs: check
    runs-on: local-runner
    steps:
      - name: Require a trusted repository branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork pull requests require isolated validation before this check can pass."
          exit 1
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Check out the normative OHF 1.4 source
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ol/open-hypothesis-format
          token: ${{ secrets.OHF_STANDARD_READ_TOKEN }}
          github-server-url: ${{ github.server_url }}
          ref: bf1f582f977c2ac65e5537ebd9f1b1b19ae328d3
          path: standard-profile-1.4
          persist-credentials: false
      - name: Verify the exact checkouts before importing producer code
        env:
          EXPECTED_EXTRACTOR: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_EXTRACTOR"
          test "$(git -C standard-profile-1.4 rev-parse HEAD)" = bf1f582f977c2ac65e5537ebd9f1b1b19ae328d3
          test "$(git -C standard-profile-1.4 rev-parse HEAD^{tree})" = bac900f8df5c38a3ddd7efe118fce59ee0fd7931
          git diff --exit-code
          git -C standard-profile-1.4 diff --exit-code
          mkdir profile-ci
          python3.12 - <<'PYCODE'
          import json, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          pair = {'extractor_commit': git('rev-parse', 'HEAD'),
                  'extractor_tree': git('rev-parse', 'HEAD^{tree}'),
                  'standard_commit': git('-C', 'standard-profile-1.4', 'rev-parse', 'HEAD'),
                  'standard_tree': git('-C', 'standard-profile-1.4', 'rev-parse', 'HEAD^{tree}')}
          with open('profile-ci/heads.json', 'x') as stream:
              json.dump(pair, stream, indent=2)
          print(json.dumps(pair, sort_keys=True))
          PYCODE
      - name: Install the pinned validation environment
        run: |
          python3.12 -m venv .profile-venv
          .profile-venv/bin/python -m pip install -r requirements.txt
      - name: Selected profile mutations and complete invented scenario
        timeout-minutes: 84
        env:
          OHF_REPO: ${{ github.workspace }}/standard-profile-1.4
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          timeout 5040s nice -n 15 .profile-venv/bin/python -I -B scripts/tests/native_profile_ci_driver.py \
            --parent --pair profile-ci/heads.json --output profile-ci
      - name: Verify twofold measured batch headroom
        run: .profile-venv/bin/python -I -B scripts/tests/native_profile_ci_driver.py --check-headroom profile-ci
